name: Publish ROPE exploration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install figure dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser plot calculations
        run: node code/test_viewer.mjs
      - name: Check the math
        run: python -m unittest discover -s code -p 'test_*.py'
      - name: Verify saved model-plot data
        run: python code/reproduce_observations.py --verify
      - name: Regenerate constructed examples
        run: python code/figures.py
      - name: Regenerate observations figures
        run: python code/observations.py
      - name: Reanalyse translation confirmation and regenerate figures
        run: python code/translation.py
      - name: Recompute recorded speed comparison tables
        run: python code/speed_results.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
