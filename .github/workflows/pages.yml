name: Publish ROPE exploration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install figure dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser plot calculations
        run: node code/test_viewer.mjs
      - name: Check shared query-pair scales
        run: node code/test_head_pair.mjs
      - name: Check the math
        run: python -m unittest discover -s code -p 'test_*.py'
      - name: Verify saved model-plot data
        run: python code/reproduce_observations.py --verify
      - name: Regenerate constructed examples
        run: python code/figures.py
      - name: Regenerate fixed-phase amplitude example
        run: python code/amplitude_modulation.py
      - name: Recompute all-position phase and small-bias results
        run: python code/recompute_phase_results.py
      - name: Recompute large versus small query-bias phase results
        run: python code/bias_phase_results.py
      - name: Regenerate observations figures
        run: python code/observations.py
      - name: Regenerate shared-KV query-pair sheet
        run: python code/head_pair_atlas.py --layer 14 --start 48
      - name: Regenerate original slow-pair bias phases
        run: python code/slow_bias_phases.py
      - name: Reproduce archived translation figures
        run: python code/translation.py
      - name: Reproduce archived adapter comparisons
        run: python code/adapter_results.py
      - name: Recompute recorded speed comparison tables
        run: python code/speed_results.py
      - name: Quantify slow frequencies and regenerate explanatory figure
        run: python code/slow_frequencies.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
